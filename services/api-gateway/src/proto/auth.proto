syntax = "proto3";

package auth;

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse);
}

message ValidateTokenRequest {
  string token = 1;
  string tenant_id = 2;
}

// ISO-06 (Batch 176): this was `repeated string tenant_ids = 3` — a shape
// mimicking the RETIRED users.tenantIds membership column, fabricated by
// the service from the request's single tenant. The honest contract is the
// one tenant the validation was scoped to; memberships live in
// user_tenant_roles and are NEVER asserted here.
message User {
  string id = 1;
  string email = 2;
  string tenant_id = 3;
  repeated string roles = 4;
}

message ValidateTokenResponse {
  bool valid = 1;
  User user = 2;
  string error = 3;
}

message CheckPermissionRequest {
  string user_id = 1;
  string tenant_id = 2;
  string resource = 3;
  string action = 4;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message GetUserRolesRequest {
  string user_id = 1;
  string tenant_id = 2;
}

message GetUserRolesResponse {
  repeated string roles = 1;
}
