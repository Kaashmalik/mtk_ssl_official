# Shakir Super League - Nginx WAF & IP Allowlist Rules

# IP Allowlist for admin and internal access
geo $admin_client {
    default 0;
    127.0.0.1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    # Add trusted public IPs below
    # 203.0.113.50 1;
}

# 1. Block SQL Injection patterns
map $request_uri $sqli_block {
    default 0;
    "~*(union|select|insert|update|delete|drop|alter|create|truncate|into|load_file|outfile)" 1;
}

# 2. Block Cross-Site Scripting (XSS) patterns
map $request_uri $xss_block {
    default 0;
    "~*(<script|script>|javascript:|alert\(|onerror=|onload=|<iframe|iframe>)" 1;
}

# 3. Block malicious User Agents (Scanners, Bots)
map $http_user_agent $bad_bot {
    default 0;
    "~*(sqlmap|nikto|nmap|dirbuster|gobuster|masscan|hydra|w3af|acunetix|nessus)" 1;
}
