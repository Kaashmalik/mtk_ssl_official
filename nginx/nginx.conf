events {
    worker_connections 1024;
}

http {
    include waf-security.conf;

    # Upstreams
    upstream api_main {
        server api:4000;
    }

    upstream api_gateway {
        server api-gateway:3000;
    }

    upstream scoring_ws {
        server scoring-service:4002;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=1000r/s;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 80;
        server_name ssl.mtkcodex.site api.ssl.mtkcodex.site ws.ssl.mtkcodex.site;
        return 301 https://$host$request_uri;
    }

    # ============================================
    # Main REST API (api.ssl.mtkcodex.site)
    # Routes to the main NestJS API service on port 4000
    # ============================================
    server {
        listen 443 ssl http2;
        server_name api.ssl.mtkcodex.site;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # WAF Checks
        if ($sqli_block) { return 403; }
        if ($xss_block) { return 403; }
        if ($bad_bot) { return 403; }

        # Health check endpoint (no rate limit)
        location = /api/health {
            proxy_pass http://api_main;
            access_log off;
        }

        location / {
            limit_req zone=api burst=200 nodelay;

            proxy_pass http://api_main;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running requests
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # ============================================
    # API Gateway (gateway.ssl.mtkcodex.site) - gRPC routing
    # Optional: only needed if using the microservices gateway
    # ============================================
    server {
        listen 443 ssl http2;
        server_name gateway.ssl.mtkcodex.site;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # WAF Checks
        if ($sqli_block) { return 403; }
        if ($xss_block) { return 403; }
        if ($bad_bot) { return 403; }

        location /api/v1/health {
            proxy_pass http://api_gateway;
            access_log off;
        }

        location / {
            limit_req zone=api burst=200 nodelay;

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================
    # WebSocket Server for Real-time Scoring (ws.ssl.mtkcodex.site)
    # ============================================
    server {
        listen 443 ssl http2;
        server_name ws.ssl.mtkcodex.site;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # WAF Checks
        if ($sqli_block) { return 403; }
        if ($xss_block) { return 403; }
        if ($bad_bot) { return 403; }

        location / {
            limit_req zone=ws burst=5000 nodelay;

            proxy_pass http://scoring_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific timeouts (7 day keepalive)
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }
    }

    # Metrics endpoint (internal only, restrict access)
    server {
        listen 9090;
        server_name localhost;

        location /metrics {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
