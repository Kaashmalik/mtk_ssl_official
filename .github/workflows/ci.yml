name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release evidence checker
        run: |
          pnpm test:release
          bash -n deploy-vps.sh

      - name: Database Package Build
        run: pnpm --filter @mtk/database build

      - name: Run Lint
        run: pnpm lint

      - name: Run Type Check
        run: pnpm type-check

      - name: Run Unit Tests
        # Runs every workspace's test task (turbo also builds dependencies first),
        # so no service can ship with a silently skipped test suite.
        # Bounded concurrency: Vitest and Jest each size their worker pool to the
        # runner's CPU count, so turbo's default of 10 simultaneous suites makes
        # 4-core runners oversubscribe and turns import-heavy tests into
        # timeouts. Four matches the runner.
        run: pnpm turbo run test --concurrency=4

      - name: Build Web App
        run: pnpm --filter @mtk/web build
        env:
          # Placeholder-safe: web build skips invalid Clerk keys
          NEXT_TELEMETRY_DISABLED: "1"
          SENTRY_UPLOAD: "0"

      - name: Build Admin App
        run: pnpm --filter @mtk/admin build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SENTRY_UPLOAD: "0"

      - name: Build Marketing App
        run: pnpm --filter @mtk/marketing build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SENTRY_UPLOAD: "0"

      - name: Build Storybook (UI kit)
        # A story that no longer compiles against the UI kit fails the PR.
        run: pnpm --filter @mtk/ui build-storybook

      - name: Run API E2E Tests
        run: pnpm --filter @mtk/api test:e2e

  e2e-secrets:
    # The web app cannot serve a single request without a build-time Clerk
    # key (clerkMiddleware throws on every route), and the suite's public
    # pages read the database. Check both up front so forks and PRs without
    # secrets skip the E2E job cleanly instead of failing it.
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check required secrets
        id: check
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: |
          missing=""
          [ -z "$CLERK_PUBLISHABLE_KEY" ] && missing="$missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          [ -z "$CLERK_SECRET_KEY" ] && missing="$missing CLERK_SECRET_KEY"
          [ -z "$SUPABASE_URL" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$SUPABASE_ANON_KEY" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "$DATABASE_URL" ] && missing="$missing E2E_DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Web E2E skipped, missing secrets:$missing"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  e2e-web:
    # Playwright suite for the web app, against a production `next start`
    # build (what we actually ship) rather than the dev server.
    needs: e2e-secrets
    if: needs.e2e-secrets.outputs.available == 'true'
    runs-on: ubuntu-latest
    env:
      # NEXT_PUBLIC_* are inlined at build time, so build, server and tests
      # all read them from job-level env.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
      SENTRY_UPLOAD: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Database Package Build
        run: pnpm --filter @mtk/database build

      - name: Build Web App
        run: pnpm --filter @mtk/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SENTRY_UPLOAD: "0"

      - name: Install Playwright Chromium
        run: pnpm --filter @mtk/e2e exec playwright install --with-deps chromium

      - name: Start web server
        run: |
          pnpm --filter @mtk/web exec next start -p 3001 &
          npx -y wait-on http://localhost:3001 -t 120000

      - name: Detect visual baselines
        # Screenshot comparison runs only once baselines are committed (see the
        # visual-baselines job), so a missing baseline never fails CI.
        id: visual
        run: |
          if ls tests/e2e/specs/visual.spec.ts-snapshots/*-chromium-linux.png >/dev/null 2>&1; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Visual regression skipped: no baselines committed yet (run the visual-baselines job)."
          fi

      - name: Run Playwright E2E
        run: pnpm --filter @mtk/e2e exec playwright test --project=chromium
        env:
          CI: "1"
          BASE_URL: http://localhost:3001
          # Optional: enables the database-backed specs.
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          NEXT_TELEMETRY_DISABLED: "1"
          # Optional journeys (tests/e2e/support/env.ts). Missing values skip.
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # Writes are opt-in per repository and must point at a staging DB.
          E2E_ALLOW_WRITES: ${{ vars.E2E_ALLOW_WRITES }}
          E2E_SCORING_MATCH_ID: ${{ vars.E2E_SCORING_MATCH_ID }}
          E2E_CHAT_MATCH_ID: ${{ vars.E2E_CHAT_MATCH_ID }}
          E2E_VISUAL: ${{ steps.visual.outputs.enabled }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
