# ============================================
# SSL Production Deployment Configuration
# ============================================

services:
  # ============================================
  # Infrastructure
  # ============================================

  # NOTE: PostgreSQL can be replaced with Supabase (managed Postgres).
  # This container sits behind the "selfhosted-db" profile so a plain
  # `docker compose up -d` does NOT start it. Every service reads DATABASE_URL
  # from the env file, so with Supabase you simply never enable this profile.
  # To self-host instead:  docker compose --profile selfhosted-db up -d
  postgres:
    image: postgres:17-alpine
    container_name: ssl-prod-postgres
    restart: unless-stopped
    profiles: ["selfhosted-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ssl_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssl}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssl-prod-network

  redis:
    image: redis:7-alpine
    container_name: ssl-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssl-prod-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ssl-prod-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ssl_analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ssl}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_prod_data:/var/lib/clickhouse
    networks:
      - ssl-prod-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ssl-prod-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ssl-prod-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ssl-prod-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ssl-prod-network

  # ============================================
  # Microservices
  # ============================================
  # Main REST API service (full CRUD, SSL automation, cron endpoints)
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: ssl-prod-api
    restart: unless-stopped
    # NOT published to the host. This service trusts `x-user-roles` /
    # `x-user-id` headers as set by the api-gateway, so it must only be reachable
    # on the internal compose network. Publishing 4000 let any caller reach it
    # directly, bypassing the gateway that overwrites those headers. RolesGuard
    # and PermissionsGuard now additionally require the internal service token,
    # so network exposure is no longer the only thing standing between a caller
    # and forged role claims.
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # Required in production by env validation (prodRequired). It was never
      # wired here, so this container failed boot-time env validation and
      # crash-looped. It must be the same value any upstream caller presents.
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}
      # Fail closed explicitly. Defaults already resolve this way in production.
      AUTH_REQUIRED: "true"
      # Intentionally left unset/false: no router currently proxies to this
      # service (it is absent from the api-gateway serviceMap), so there is no
      # trusted source for x-user-roles. RolesGuard will therefore reject every
      # @Roles route until a caller presenting API_AUTH_TOKEN is wired up.
      TRUST_ROLE_HEADER: "false"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ssl.mtkcodex.site,https://admin.ssl.mtkcodex.site}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # SSL / ACME automation
      ACME_ENVIRONMENT: ${ACME_ENVIRONMENT:-production}
      ACME_KEY_DIR: /app/certs/keys
      CERT_STORAGE_DIR: /app/certs
      DNS_PROVIDER: ${DNS_PROVIDER:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      SSL_ADMIN_TOKEN: ${SSL_ADMIN_TOKEN:-${CRON_SECRET}}
      CRON_SECRET: ${CRON_SECRET:-}
      IMPERSONATION_TOKEN_SECRET: ${IMPERSONATION_TOKEN_SECRET:-}
    volumes:
      - ssl_certs:/app/certs
    depends_on:
      redis:
        condition: service_started
    networks:
      - ssl-prod-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ssl-prod-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 5001
      TOURNAMENT_SERVICE_HOST: tournament-service
      TOURNAMENT_SERVICE_PORT: 5002
      SCORING_SERVICE_HOST: scoring-service
      SCORING_SERVICE_PORT: 4002
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 5004
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 5005
    depends_on:
      - redis
      - auth-service
      - scoring-service
    networks:
      - ssl-prod-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: ssl-prod-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      - redis
    networks:
      - ssl-prod-network

  scoring-service:
    build:
      context: .
      dockerfile: services/scoring-service/Dockerfile
    container_name: ssl-prod-scoring-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      DATABASE_URL: ${DATABASE_URL}
      SENTRY_DSN: ${SENTRY_DSN}
      # Guards POST /scoring/* write endpoints (fails closed when unset)
      SCORING_SERVICE_TOKEN: ${SCORING_SERVICE_TOKEN}
      SCORING_GATEWAY_TOKEN: ${SCORING_GATEWAY_TOKEN}
    depends_on:
      - redis
      - kafka
    networks:
      - ssl-prod-network

  tournament-service:
    build:
      context: .
      dockerfile: services/tournament-service/Dockerfile
    container_name: ssl-prod-tournament-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5002
      KAFKA_BROKERS: kafka:29092
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - kafka
    networks:
      - ssl-prod-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: ssl-prod-payment-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5006
      DATABASE_URL: ${DATABASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      JAZZCASH_MERCHANT_ID: ${JAZZCASH_MERCHANT_ID}
      JAZZCASH_PASSWORD: ${JAZZCASH_PASSWORD}
    networks:
      - ssl-prod-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: ssl-prod-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5005
      KAFKA_BROKERS: kafka:29092
      DATABASE_URL: ${DATABASE_URL}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      TWILIO_SID: ${TWILIO_SID}
      TWILIO_TOKEN: ${TWILIO_TOKEN}
    depends_on:
      - kafka
    networks:
      - ssl-prod-network

  ai-commentary-service:
    build:
      context: .
      dockerfile: services/ai-commentary-service/Dockerfile
    container_name: ssl-prod-ai-commentary
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5006
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - kafka
      - redis
    networks:
      - ssl-prod-network

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: ssl-prod-analytics
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5007
      KAFKA_BROKERS: kafka:29092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ssl}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      - kafka
      - clickhouse
    networks:
      - ssl-prod-network

  streaming-service:
    build:
      context: .
      dockerfile: services/streaming-service/Dockerfile
    container_name: ssl-prod-streaming
    restart: unless-stopped
    ports:
      - "5008:5008"
      - "10000-10100:10000-10100/udp"
      - "40000-49999:40000-49999/udp"
    environment:
      NODE_ENV: production
      PORT: 5008
      KAFKA_BROKERS: kafka:29092
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP}
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 49999
    depends_on:
      - kafka
    networks:
      - ssl-prod-network

  # ============================================
  # Frontend
  # ============================================
  # NOTE: Web, Admin, and Marketing apps are deployed to Vercel in production.
  # This service is only used for full-stack local/Docker testing.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ssl-prod-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4002}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      # --- server-only ---
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      # ball writes are proxied from authenticated server actions
      SCORING_SERVICE_URL: http://scoring-service:4002
      SCORING_SERVICE_TOKEN: ${SCORING_SERVICE_TOKEN}
      # OTP hashing, renewal cron, impersonation handoff
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      IMPERSONATION_TOKEN_SECRET: ${IMPERSONATION_TOKEN_SECRET}
      WEB_APP_URL: ${WEB_APP_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - api-gateway
    networks:
      - ssl-prod-network

  # ============================================
  # Reverse Proxy (Nginx)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: ssl-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api-gateway
    networks:
      - ssl-prod-network

volumes:
  postgres_prod_data:
  redis_prod_data:
  clickhouse_prod_data:
  ssl_certs:

networks:
  ssl-prod-network:
    driver: bridge
